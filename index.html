/* ============================================================
   [1] 디자인 토큰 — 색과 글꼴을 여기서 한 번에 관리합니다.
   ============================================================ */
:root{
  --pale:#DCDAD6;      /* 페이지 배경 (중성 회색) */
  --pale-2:#E5E3DF;
  --ink:#17181A;
  --mid:#6E6F72;
  --hair:#BDBBB6;
  --bf:#A24A2C;        /* 고로 — 아트워크의 용암색에서 뽑음 */
  --eaf:#4E6285;       /* 전기로 — 아크 방전색 */
  --accent:var(--bf);
  --display:'HDharmony','Pretendard','Noto Sans KR',sans-serif;
  --body:'HDharmony','Pretendard','Noto Sans KR',sans-serif;
  --mono:'HDharmony','Pretendard','Noto Sans KR',sans-serif;
}
html[data-line="eaf"]{ --accent:var(--eaf); }

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--pale);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.8;
  letter-spacing:-.01em;word-break:keep-all;
}
.wrap{max-width:560px;margin:0 auto;background:var(--pale);overflow:hidden}
img{display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.eyebrow{color:#54555A;display:block;font-size:15px;letter-spacing:.08em;margin-bottom:16px}
.eyebrow.solo{margin-bottom:22px}   /* 제목 없이 홀로 쓰일 때 아래 여백을 넓힘 */
section{padding:44px 24px;border-bottom:1px solid var(--hair)}
h2{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.35;margin-bottom:18px}
p{color:#2A2B2E}

/* ---- [2] 상단 유틸리티 바 ---- */
.util{display:flex;justify-content:space-between;align-items:center;padding:7px 16px 7px 24px;background:var(--ink)}
.util .org{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:#8E8F96}
.langs{display:flex;gap:2px}
.langs button{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.06em;background:none;border:0;color:#8A8B92;padding:9px 15px;min-height:40px;border-radius:3px;cursor:pointer;transition:color .2s ease,background .2s ease}
.langs button[aria-pressed="true"]{color:#fff;background:#2E3136}

/* ---- [3] 히어로 = 사용설명서 앞면 그대로 ---- */
.cover img{width:100%}

/* ---- [4] 브랜드 문구 (인쇄물 뒷면 상단과 동일) ---- */
.statement{text-align:center;padding:52px 28px}
.statement .wordmark{
  font-family:var(--display);font-weight:700;
  font-size:26px;letter-spacing:-.02em;color:var(--mid);margin-bottom:26px;
}
.statement p{font-size:15px;line-height:2;white-space:pre-line}

/* ---- [5] 라인 선택 ---- */
.picker .q{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:#54555A;margin-bottom:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{background:transparent;border:1px solid var(--hair);color:var(--mid);padding:13px 12px;text-align:left;cursor:pointer;font-family:var(--body);transition:all .25s ease}
.tab .code{font-family:var(--mono);font-size:13px;letter-spacing:.06em;display:block}
.tab .nm{font-size:14px;display:block;margin-top:3px;line-height:1.5}
.tab[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:rgba(255,255,255,.45)}
.tab[aria-pressed="true"] .code{color:var(--accent)}

/* 라인에 따라 바뀌는 제품 사진 */
.shot{position:relative;height:280px;margin:6px 0 22px}
.shot img{position:absolute;inset:0;margin:auto;height:100%;width:auto;opacity:0;transition:opacity .5s ease}
.shot img.on{opacity:1}

/* 라인에 따라 바뀌는 원료 사진 (BF 사진 비율 1100:930 기준) */
.mat{position:relative;aspect-ratio:1100/930;overflow:hidden}
.mat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
.mat img.on{opacity:1}

/* ---- [6] 향 설명 ---- */
.scent-head{display:flex;align-items:baseline;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--accent);transition:border-color .45s ease}
.scent-head .code{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.1em;color:var(--accent);transition:color .45s ease}
.scent-head .ttl{font-size:16px;font-weight:600}
.family{font-family:var(--mono);font-size:14px;letter-spacing:.12em;color:#54555A;margin-top:18px}
.quote{
  font-size:16px;line-height:1.7;margin-top:10px;padding-left:14px;
  border-left:2px solid var(--hair);color:var(--ink);
}
.scent-desc{margin-top:18px;font-size:15px;color:#3A3B3E}

/* ---- [7] 사진 블록 ---- */
figure{border-bottom:1px solid var(--hair)}
figure img{width:100%}
figcaption{font-family:var(--mono);font-size:13px;letter-spacing:.03em;color:#54555A;padding:12px 24px;background:var(--pale)}

/* ---- [8] 구성품 ---- */
.parts{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);align-items:center}
.parts:last-child{border-bottom:0}
.parts .i{font-family:var(--mono);font-size:12px;color:var(--accent);transition:color .45s ease}
.parts .qty{font-family:var(--mono);font-size:15px;color:#54555A;white-space:nowrap}

/* ---- [9] 사용 방법 ---- */
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--hair)}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:4px;transition:color .45s ease}
.step p{font-size:15px;margin:0}
.step .tip{font-size:14px;color:#5C5D61;margin-top:6px}

/* ---- [10] 주의사항 ---- */
.safety{background:var(--pale-2)}
.safety ol{list-style:none;counter-reset:s}
.safety li{counter-increment:s;padding:12px 0 12px 32px;border-bottom:1px solid var(--hair);font-size:14px;position:relative}
.safety li:last-child{border-bottom:0}
.safety li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:12px;font-family:var(--mono);font-size:12px;color:var(--accent);transition:color .45s ease}

/* ---- [11] 제품 정보 ---- */
.spec-row{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.spec-row dt{font-family:var(--mono);font-size:13px;letter-spacing:.02em;color:#54555A}
.spec-row dd{font-size:15px}

/* ---- [12] 푸터 ---- */
footer{background:var(--ink);color:#8B8C92;padding:36px 24px 46px;font-size:14px}
footer .lockup{
  font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;
  color:#fff;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #2A2C30;
}
footer .lockup span{color:#5E6066;margin:0 8px;font-weight:500}
footer .nfs{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--accent);margin-top:22px;transition:color .45s ease}

.spec-row a{color:inherit;text-decoration:underline;text-underline-offset:3px}
footer .mail{color:#B4B7BC;text-decoration:underline;text-underline-offset:3px;word-break:break-all}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ================================================================

   ================================================================ */
let lang = "ko";
let line = "bf";

function render(){
  const t = CONTENT[lang];

  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = t[el.dataset.t];
    if(typeof v === "string") el.textContent = v;
  });

  document.getElementById("partsList").innerHTML = t.parts.map((p,i)=>`
    <div class="parts">
      <span class="i">${String(i+1).padStart(2,"0")}</span>
      <span>${p[0]}</span><span class="qty">${p[1]}</span>
    </div>`).join("");

  document.getElementById("steps").innerHTML = t.steps.map((s,i)=>`
    <div class="step">
      <span class="n">${String(i+1).padStart(2,"0")}</span>
      <div><p>${s.p}</p>${s.tip ? `<p class="tip">${s.tip}</p>` : ""}</div>
    </div>`).join("");

  document.getElementById("safetyList").innerHTML =
    t.safety.map(s=>`<li>${s}</li>`).join("");

  document.getElementById("specList").innerHTML =
    t.spec.map(([k,v])=>`<div class="spec-row"><dt>${k}</dt><dd>${v}</dd></div>`).join("");

  const s = SCENTS[line];
  document.getElementById("scentCode").textContent   = s.code;
  document.getElementById("scentTitle").textContent  = s[lang].title;
  document.getElementById("scentFamily").textContent = s[lang].family;
  document.getElementById("scentQuote").textContent  = s[lang].quote;
  document.getElementById("scentDesc").textContent   = s[lang].desc;

  document.getElementById("capMaterial").textContent =
    line === "eaf" ? t.capScrap : t.capOre;

  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
}

document.querySelectorAll(".langs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    lang = btn.dataset.lang;
    document.querySelectorAll(".langs button").forEach(b=>
      b.setAttribute("aria-pressed", b === btn));
    render();
  });
});

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    line = btn.dataset.lineval;
    document.documentElement.dataset.line = line;
    document.getElementById("shotBf").classList.toggle("on",  line==="bf");
    document.getElementById("shotEaf").classList.toggle("on", line==="eaf");
    document.getElementById("matBf").classList.toggle("on",  line==="bf");
    document.getElementById("matEaf").classList.toggle("on", line==="eaf");
    document.querySelectorAll(".tab").forEach(b=>
      b.setAttribute("aria-pressed", b === btn));
    render();
  });
});
